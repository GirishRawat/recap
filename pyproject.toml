[project]
name = "recap"
version = "0.0.1"
description = "Local meeting recorder: notes, summary, action items, highlight and explainer videos, all on your own Mac."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Added milestone by milestone; see docs/PROGRESS.md.
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
recap = "recap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
